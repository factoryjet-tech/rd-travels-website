  <!-- 4. FAQPage (route-specific) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "How much does an Ahmedabad to Mumbai cab cost?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Rates depend on vehicle class, travel date, and whether it's one-way or round-trip. A sedan one-way is priced from ₹11/km; an Innova round-trip runs differently. NH 48 has 8–10 toll plazas billed at actuals and listed separately in your quote. WhatsApp RDB Travels for a GST-itemised quote in about 15 minutes."
        }
      },
      {
        "@type": "Question",
        "name": "When should I leave Ahmedabad for a morning flight to Mumbai?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Work backwards from your boarding time. For a 6am domestic flight: check-in closes at 4am, drive time is 9–10 hours plus 45–90 minutes for Ahmedabad city traffic — depart around 5:30–6pm the previous evening. For a 9am flight, depart around 9pm the previous evening. For a 6pm flight, depart around 6am the same morning."
        }
      },
      {
        "@type": "Question",
        "name": "Is the Ahmedabad to Mumbai cab one-way or round-trip?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Both formats are available. One-way airport drops to Mumbai are the most-booked format on this route. Round-trip pricing gives a slight per-km discount on the return leg. WhatsApp for the exact number based on your dates and vehicle preference."
        }
      },
      {
        "@type": "Question",
        "name": "Do you drop to Andheri, Bandra, Thane, Navi Mumbai, or Pune?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes — RDB Travels drops anywhere in Mumbai and the wider Mumbai Metropolitan Region, including Andheri, Bandra, BKC, Powai, Thane, and Navi Mumbai. For Pune, that extends the route to approximately 660 km total, quoted separately."
        }
      },
      {
        "@type": "Question",
        "name": "What if my Mumbai flight is delayed and I need a pickup?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "For airport pickups, the driver tracks your flight's live arrival status and waits up to 90 minutes from the scheduled landing time at no extra cost. For delays beyond that, RDB Travels' dispatch desk coordinates directly — you are not left managing an app at midnight."
        }
      },
      {
        "@type": "Question",
        "name": "How early should I book an Ahmedabad to Mumbai cab?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "For a sedan one-way, same-day bookings are possible if slots are open — check on WhatsApp. For Innova and Tempo Traveller bookings, 48 hours ahead is safer. For long-weekend dates (Diwali, Navratri, New Year), book a week out as the route fills fast."
        }
      }
    ]
  }
