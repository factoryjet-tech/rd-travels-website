  <!-- Structured Data: FAQPage — all 20 Q&As -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Are you a broker or a direct operator?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A direct operator with a vetted owner-driver network. Founded 2015 by Ronak Dineshbhai Barot. We run the dispatch desk in Ahmedabad — we confirm the vehicle, vet and know every driver by name, and own accountability for your trip. The driver you get owns the vehicle and has made the route many times. No anonymous-app matching, no broker markup, no 'the operator said something else' on trip day. You can come visit the office before you book — most repeat customers have."
        }
      },
      {
        "@type": "Question",
        "name": "Do I need to pay an advance to get a quote?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Quotes are free and non-binding. We send GST-itemised numbers on WhatsApp; you decide. For confirmed bookings, most one-day trips need no advance. Multi-day tours and bus bookings take a small confirmation amount (10–20% typical), balance settles after the trip."
        }
      },
      {
        "@type": "Question",
        "name": "Is the quote GST-inclusive?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We itemise GST separately so you can see what's vehicle, what's tax. We're GST-registered (GSTIN displayed on every invoice), so corporate customers can claim input credit. The total on the WhatsApp quote is what you pay — no convenience fee at handover."
        }
      },
      {
        "@type": "Question",
        "name": "What's the largest vehicle you operate?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "56-seater Volvo Multi-Axle and 56-seater Bharat Benz coaches for premium long-distance. We also run 45-seater AC coaches, 40-seater AC mini coaches, and 32-seater non-AC mini buses. Below that, the full Tempo Traveller range (9, 12, 17, 20, 26-seater Maharaja). And cars from Sedan to Innova Crysta."
        }
      },
      {
        "@type": "Question",
        "name": "Do you handle airport drops and pickups for late-night flights?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes — Mumbai BOM Terminal 2 is our most-booked route, including 3am drops and 1am pickups. We work backwards from your boarding time, factor in toll and traffic, and pad realistically. Driver waits for delayed flights at no extra cost up to 90 minutes."
        }
      },
      {
        "@type": "Question",
        "name": "What permits and insurance cover the vehicles?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Every vehicle has a Tourist Vehicle Permit (TVP), All-India Tourist Permit (AITP) for inter-state travel, valid PUC and fitness, and comprehensive insurance covering passengers for the trip duration. Drivers are police-verified, vetted by our office, and known to dispatch by name — not anonymous-app matching. Documentation available on request."
        }
      },
      {
        "@type": "Question",
        "name": "What languages do your drivers speak?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Gujarati, Hindi, and basic English on every driver. Specific drivers speak Marathi (Mumbai/Maharashtra routes), Rajasthani (Rajasthan circuits), or other regional languages — request when booking."
        }
      },
      {
        "@type": "Question",
        "name": "Do you do single one-way drops, or only round-trips?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Both. One-way pricing is per-km outstation rate. Round-trip pricing has a slight per-day discount on the daily kilometers. Mumbai airport drop is the most common one-way; family pilgrimage and tours are usually round-trip."
        }
      },
      {
        "@type": "Question",
        "name": "How much does an Ahmedabad to Mumbai taxi cost?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The Ahmedabad–Mumbai route is roughly 525 km on NH 48. Rates vary by vehicle class, travel date, and whether the trip is one-way or round-trip — a sedan one-way runs differently from an Innova round-trip. WhatsApp us your dates and group size for a GST-itemised quote; we usually respond in 15 minutes."
        }
      },
      {
        "@type": "Question",
        "name": "How many people fit in a tempo traveller?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Our Tempo Traveller range runs from 9-seater to 26-seater Maharaja. The standard 12-seater fits 12 passengers plus driver with luggage space; the 17-seater is the most-booked size for extended families and corporate groups; the 26-seater Maharaja has push-back recliner seats and a larger luggage bay. Tell us your group count on WhatsApp and we'll match you to the right vehicle."
        }
      },
      {
        "@type": "Question",
        "name": "Can I rent a car for a single day in Ahmedabad?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes — 8-hour city packages and outstation one-way day trips are available. A sedan or Innova for a single day covers airport transfers, business meetings in Vadodara, or any in-city requirement. Package rates are on the fleet cards; WhatsApp for an exact quote based on your route."
        }
      },
      {
        "@type": "Question",
        "name": "Are night halt charges and driver bata included in the quote?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Every quote we send is itemised — vehicle rate, driver bata, GST, and applicable night-halt allowance are all listed separately. There are no surprise additions at handover. Tolls, parking, and inter-state permits are billed at actuals and flagged in the quote upfront."
        }
      },
      {
        "@type": "Question",
        "name": "Do you provide a GST invoice for corporate bookings?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. RD Travels is GST-registered and issues a proper tax invoice for every trip — GSTIN is printed on the invoice. Corporate customers can claim input credit. Multiple trips can be consolidated on a single monthly invoice; mention that requirement when you book."
        }
      },
      {
        "@type": "Question",
        "name": "How do I book — WhatsApp, call, or the website?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "WhatsApp is the fastest path — share pickup, destination, date, and group size, and a GST-itemised quote comes back in about 15 minutes. For complex itineraries (multi-vehicle weddings, corporate retainers), a call works better. The quote form on the Contact page works too, and we follow up on WhatsApp."
        }
      },
      {
        "@type": "Question",
        "name": "What's the cancellation policy?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Cancellation terms depend on how far in advance you cancel and the vehicle class booked. Day-trip bookings cancelled 24 hours or more before departure are typically charge-free; multi-day tours and bus bookings follow a sliding scale. The exact terms are stated with your booking confirmation — no hidden clauses."
        }
      },
      {
        "@type": "Question",
        "name": "Can I book a Volvo bus for a wedding party from Ahmedabad?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Our 56-seater Volvo Multi-Axle and Bharat Benz coaches are booked regularly for wedding parties — as standalone guest transport or as part of a multi-vehicle arrangement (bridal car, band bus, family Tempos). Book early for peak wedding season. One call or WhatsApp to our desk handles the full fleet requirement."
        }
      },
      {
        "@type": "Question",
        "name": "Do you do multi-day trips like Rajasthan circuit, Statue of Unity, or Somnath–Dwarka?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes — multi-day outstation trips are a significant part of our bookings. Rajasthan circuits (Udaipur, Jaipur, Jodhpur), Somnath–Dwarka pilgrimage, Kutch and Bhuj, and longer routes to Pune or Nashik. We plan the itinerary day-by-day with realistic drive times, and the driver stays with your group throughout."
        }
      },
      {
        "@type": "Question",
        "name": "Do I get the same vehicle and driver across a multi-day trip?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. The owner-driver who picks you up on day one stays with the trip through the last drop. This is not a relay system — the same person knows the route, knows the group, and is reachable directly. Ronak's dispatch desk also stays contactable for the full duration."
        }
      },
      {
        "@type": "Question",
        "name": "What if there's a breakdown or issue during the trip?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The driver contacts the office immediately if anything flags on the road. Ronak's desk arranges a replacement vehicle or roadside support as fast as possible. All vehicles carry valid fitness certificates and are checked before departure — breakdown situations are rare, and we have a protocol when they happen."
        }
      },
      {
        "@type": "Question",
        "name": "Do you offer monthly car rental or long-term hire from Ahmedabad?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes — monthly retainer arrangements are available. A dedicated vehicle with a regular driver, consolidated monthly billing, and a GST invoice. Works well for businesses that need regular executive transport or frequent outstation travel without ad-hoc booking overhead. WhatsApp or call the office to discuss terms."
        }
      }
    ]
  }
  </script>

  <style>
    /* Mobile sticky CTA bar — only renders below 760px */
    .mobile-cta {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.96);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-top: 1px solid var(--color-border);
      padding: 12px 16px;
      display: none;
      gap: 10px;
      z-index: 50;
    }
    @media (max-width: 760px) {
      .mobile-cta { display: flex; }
      body { padding-bottom: 84px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Chrome.jsx"></script>
  <script type="text/babel" src="Cards.jsx"></script>
  <script type="text/babel" src="HomePage.jsx"></script>
  <script type="text/babel" src="AboutContact.jsx"></script>

  <script type="text/babel">
    const META = {
      home: {
        title: "RD Travels — Ahmedabad's owner-driver network. Cars, tempo travellers & buses with driver",
        desc:  "Direct travels operator in Ahmedabad since 2015. Sedan, Innova, tempo traveller, and Volvo bus hire with driver — for outstation trips, airport transfer, weddings, and group travel. GST-compliant. Quote on WhatsApp in 15 minutes."
      },
      about: {
        title: "About RD Travels — Founded 2015 by Ronak Dineshbhai Barot, Ahmedabad",
        desc:  "How RD Travels became Ahmedabad's direct dispatch desk for a vetted owner-driver network. Founder Ronak Dineshbhai Barot. Ten years of trips across Gujarat and pan-India routes."
      },
      contact: {
        title: "Contact RD Travels — Ahmedabad office, WhatsApp +91 98765 43210",
        desc:  "Reach RD Travels for outstation taxi, tempo traveller hire, and bus rental in Ahmedabad. WhatsApp, call, or email. Same dispatch desk since 2015."
      }
    };

    const App = () => {
      const [page, setPage] = React.useState("home");

      React.useEffect(() => {
        window.scrollTo({ top: 0, behavior: "instant" });
      }, [page]);

      React.useEffect(() => {
        const m = META[page] || META.home;
        document.title = m.title;
        const tag = document.querySelector('meta[name="description"]');
        if (tag) tag.setAttribute("content", m.desc);
      }, [page]);

      return (
        <>
          <Header active={page} onNavigate={setPage} />
          {page === "home"    && <HomePage onNavigate={setPage} />}
          {page === "about"   && <AboutPage />}
          {page === "contact" && <ContactPage />}
          <Footer />
          <MobileCtaBar />
        </>
      );
    };
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
