<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 32px 28px; }
  .grp { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    font-family: var(--font-sans);
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1;
    border-radius: 999px;
    border: 1.5px solid transparent;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn-primary { background: var(--color-saffron); color: #fff; border-color: var(--color-saffron); }
  .btn-whatsapp { background: var(--color-whatsapp); color: #fff; border-color: var(--color-whatsapp); }
  .btn-outline { background: transparent; color: var(--color-ink); border-color: var(--color-ink); }
  .btn-ghost { background: transparent; color: var(--color-ink); border: 0; padding: 8px 0; border-radius: 0; }
  .btn-ghost .arrow { display: inline-block; }
</style></head>
<body>
<div class="card">
  <span class="label">Buttons — verb + object, always</span>
  <div class="grp">
    <div class="row">
      <button class="btn btn-primary">Get instant quote</button>
      <button class="btn btn-whatsapp">

  </div>
</div>
