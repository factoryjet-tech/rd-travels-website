<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 24px 28px; }
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .sw {
    border-radius: 10px;
    height: 130px;
    padding: 14px;
    border: 1px solid rgba(26,24,21,0.08);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .sw__name { font-size: 0.78rem; font-weight: 700; }
  .sw__hex  { font-size: 0.72rem; font-weight: 500; font-family: ui-monospace, monospace; opacity: 0.85; }
  .sw__use  { font-size: 0.72rem; font-weight: 500; line-height: 1.35; opacity: 0.85; margin-top: 6px; }
</style></head>
<body>
<div class="card">
  <span class="label">Semantic — minimal, used sparingly</span>
  <div class="swatches">
    <div class="sw" style="background: var(--color-whatsapp); color: #fff;">
      <div><div class="sw__name">--color-whatsapp</div><div class="sw__hex">#1F6F3F</div></div>
      <div class="sw__use">WhatsApp CTAs only</div>
    </div>
    <div class="sw" style="background: var(--color-success-bg); color: var(--color-success);">
      <div><div class="sw__name">--color-success-bg</div><div class="sw__hex">#E1F0E5</div></div>
      <div class="sw__use">Verified ticks, success badges</div>
    </div>
    <div class="sw" style="background: var(--color-error); color: #fff;">
      <div><div class="sw__name">--color-error</div><div class="sw__hex">#A3322A</div></div>
      <div class="sw__use">Form validation only</div>
    </div>
  </div>
</div>
</body></html>
