<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 28px; }
  .item {
    border-bottom: 1px solid rgba(26,24,21,0.08);
    padding-block: 18px;
  }
  .item:first-of-type { border-top: 1px solid rgba(26,24,21,0.08); }
  .q {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--color-ink);
    cursor: pointer;
  }
  .icon {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--color-white-warm);
    border: 1px solid rgba(26,24,21,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 300;
    color: var(--color-ink-soft);
  }
  .a {
    margin: 10px 0 0;
    font-size: 0.92rem;
    color: var(--color-ink-soft);
    line-height: 1.6;
  }
</style></head>
<body>
<div class="card">
  <span class="label">FAQ accordion — hairline dividers, plus/minus</span>
  <div>
    <div class="item">
      <div class="q"><span>Are you a broker or a direct operator?</span><span class="icon">−</span></div>
      <p class="a">Direct operator. We own our fleet and employ our drivers. The number you call is the number that picks up.</p>
    </div>
    <div class="item">
      <div class="q"><span>Do I need to pay an advance to get a quote?</span><span class="icon">+</span></div>
    </div>
    <div class="item">
      <div class="q"><span>Is the quote GST-inclusive?</span><span class="icon">+</span></div>
    </div>
  </div>
</div>
</body></html>
