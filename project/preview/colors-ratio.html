<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 28px; display: flex; align-items: stretch; gap: 0; }
  .ratio {
    display: flex;
    width: 100%;
    height: 280px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(26,24,21,0.08);
  }
  .white {
    flex: 7;
    background: #fff;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .saffron {
    flex: 3;
    background: var(--color-saffron);
    color: #fff;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .num { font-size: 3.2rem; font-weight: 200; letter-spacing: -0.04em; line-height: 1; color: var(--color-saffron); font-feature-settings: "lnum"; }
  .num--w { color: #fff; }
  .ttl { font-size: 0.95rem; font-weight: 700; }
  .sub { font-size: 0.78rem; font-weight: 500; line-height: 1.45; opacity: 0.85; }
</style></head>
<body>
<div class="ratio">
  <div class="white">
    <div class="num">70<span style="font-size:1.4rem;">%</span></div>
    <div>
      <div class="ttl" style="color: var(--color-ink);">White surfaces</div>
      <div class="sub" style="color: var(--color-ink-soft); margin-top: 4px;">The canvas. Backgrounds, cards, body text — they hold most of the page.</div>
    </div>
  </div>
  <div class="saffron">
    <div class="num num--w">30<span style="font-size:1.4rem;">%</span></div>
    <div>
      <div class="ttl">Saffron accents</div>
      <div class="sub">Paint. CTAs, accent phrases, decorative numerals, the final CTA band.</div>
    </div>
  </div>
</div>
</body></html>
