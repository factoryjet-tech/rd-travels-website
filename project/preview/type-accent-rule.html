<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 28px; }
  .panel {
    background: var(--color-white-warm);
    border: 1px solid rgba(26,24,21,0.08);
    border-radius: 14px;
    padding: 24px 28px;
  }
  .rule {
    font-size: 0.95rem;
    color: var(--color-ink-soft);
    line-height: 1.55;
    margin: 0 0 18px;
  }
  .examples {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 16px;
    padding-top: 18px;
    border-top: 1px dashed rgba(26,24,21,0.18);
  }
  .ex {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.18;
    color: var(--color-ink);
  }
  .accent { color: var(--color-saffron-deep); font-weight: inherit; font-style: normal; }
  code {
    font-family: ui-monospace, 'SF Mono', monospace;
    background: var(--color-saffron-50);
    color: var(--color-saffron-dark);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.85em;
  }
</style></head>
<body>
<div class="panel">
  <p class="rule">
    Every H1 / H2 wraps exactly one phrase in <code>&lt;span class="accent"&gt;</code> colored
    <strong style="color: var(--color-saffron-deep);">#C45F1A</strong>. Same weight, same size,
    <strong>no italic, no serif switch.</strong> Color is the entire flourish.
  </p>
  <div class="examples">
    <div class="ex">Cars, Tempo Travellers &amp; Buses, <span class="accent">with driver.</span></div>
    <div class="ex">Booking takes <span class="accent">3 steps</span> and 5 minutes.</div>
    <div class="ex">Honest answers, <span class="accent">upfront.</span></div>
  </div>
</div>
</body></html>
