<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 28px; }
  .nav {
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid rgba(26,24,21,0.08);
    padding: 14px 22px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; color: var(--color-ink); }
  .mono {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--color-saffron);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1rem;
  }
  .links { display: flex; gap: 22px; align-items: center; }
  .lnk { font-size: 0.9rem; font-weight: 500; color: var(--color-ink-soft); text-decoration: none; }
  .lnk[aria-current] { color: var(--color-ink); }
  .cta {
    background: var(--color-whatsapp);
    color: #fff;
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .mob {
    background: rgba(255,255,255,0.95);
    backdrop-filter: saturate(180%) blur(12px);
    border-top: 1px solid rgba(26,24,21,0.08);
    padding: 12px 16px;
    border-radius: 14px;
    display: flex;
    gap: 8px;
  }
  .mob .btn {
    flex: 1;
    border-radius: 999px;
    padding: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    border: 0;
    cursor: pointer;
  }
  .mob .wa { background: var(--color-whatsapp); color: #fff; }
  .mob .ca { background: var(--color-saffron); color: #fff; }
  .meta {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-ink-mute);
  }
</style></head>
<body>
<div class="card">
  <span class="meta">Sticky nav (desktop, white/85% + backdrop blur)</span>
  <div class="nav">
    <div class="brand"><div class="mono">R</div><span>RD Travels</span></div>
    <div class="links">
      <a class="lnk" aria-current="page">Home</a>
      <a class="lnk">About</a>
      <a class="lnk">Contact</a>
      <span class="cta">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp
      </span>
    </div>
  </div>
  <span class="meta">Mobile sticky-bottom CTA bar (under 760px)</span>
  <div class="mob">
    <button class="btn wa">WhatsApp us</button>
    <button class="btn ca">Call +91 98765 43210</button>
  </div>
</div>
</body></html>
