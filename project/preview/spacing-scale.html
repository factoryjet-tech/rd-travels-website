<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 28px; }
  .row { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .bar {
    background: var(--color-saffron);
    border-radius: 4px;
    width: 48px;
  }
  .name { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; color: var(--color-ink); font-family: ui-monospace, monospace; }
  .val { font-size: 0.7rem; color: var(--color-ink-mute); font-family: ui-monospace, monospace; }
</style></head>
<body>
<div class="card">
  <span class="label">Spacing scale — 8pt base</span>
  <div class="row">
    <div class="item"><div class="bar" style="height: 4px;"></div><div class="name">--space-1</div><div class="val">4px</div></div>
    <div class="item"><div class="bar" style="height: 8px;"></div><div class="name">--space-2</div><div class="val">8px</div></div>
    <div class="item"><div class="bar" style="height: 12px;"></div><div class="name">--space-3</div><div class="val">12px</div></div>
    <div class="item"><div class="bar" style="height: 16px;"></div><div class="name">--space-4</div><div class="val">16px</div></div>
    <div class="item"><div class="bar" style="height: 24px;"></div><div class="name">--space-5</div><div class="val">24px</div></div>
    <div class="item"><div class="bar" style="height: 32px;"></div><div class="name">--space-6</div><div class="val">32px</div></div>
    <div class="item"><div class="bar" style="height: 48px;"></div><div class="name">--space-7</div><div class="val">48px</div></div>
    <div class="item"><div class="bar" style="height: 64px;"></div><div class="name">--space-8</div><div class="val">64px</div></div>
    <div class="item"><div class="bar" style="height: 96px;"></div><div class="name">--space-9</div><div class="val">96px</div></div>
    <div class="item"><div class="bar" style="height: 128px;"></div><div class="name">--space-10</div><div class="val">128px</div></div>
  </div>
</div>
</body></html>
