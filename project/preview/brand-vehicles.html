<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 28px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tile {
    width: 100%; aspect-ratio: 1;
    border-radius: 12px;
    background: var(--color-saffron-soft);
    color: var(--color-saffron-deep);
    display: flex; align-items: center; justify-content: center;
  }
  .tile svg { width: 60%; height: 60%; }
  .name {
    font-size: 0.72rem;
    font-weight: 700;
    text-align: center;
    color: var(--color-ink);
  }
  .seats {
    font-size: 0.66rem;
    font-weight: 500;
    color: var(--color-ink-mute);
    text-align: center;
  }
</style></head>
<body>
<div class="card">
  <span class="label">Vehicle silhouettes — 1.6px stroke, no fill, saffron-deep</span>
  <div class="row">
    <div class="item">
      <div class="tile">
        <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21h26M8 21l3-7h14l3 7M11 21v3a1 1 0 001 1h2a1 1 0 001-1v-3M21 21v3a1 1 0 001 1h2a1 1 0 001-1v-3M11 17.5h.5M24.5 17.5h.5"/></svg>
      </div>
      <div class="name">Sedan</div>
      <div class="seats">4 + driver</div>
    </div>
    <div class="item">
      <div class="tile">
        <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h26M8 22l2-9h16l2 9M11 22v3a1 1 0 001 1h2a1 1 0 001-1v-3M21 22v3a1 1 0 001 1h2a1 1 0 001-1v-3M11 17h14"/></svg>
      </div>
      <div class="name">MPV</div>
      <div class="seats">6 + driver</div>
    </div>
    <div class="item">
      <div class="tile">
        <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h28M7 21l2-8h18l2 8M10 21v3a1 1 0 001 1h2a1 1 0 001-1v-3M22 21v3a1 1 0 001 1h2a1 1 0 001-1v-3M10 16.5h.5M25.5 16.5h.5M14 13v-2"/></svg>
      </div>
      <div class="name">SUV</div>
      <div class="seats">6–7 + driver</div>
    </div>
    <div class="item">
      <div class="tile">
        <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22h30M5 22V11a1 1 0 011-1h22a1 1 0 011 1v3l4 2v6M9 22v3a1 1 0 001 1h2a1 1 0 001-1v-3M22 22v3a1 1 0 001 1h2a1 1 0 001-1v-3M8 14h6M16 14h6M8 17h6M16 17h6"/></svg>
      </div>
      <div class="name">Tempo</div>
      <div class="seats">12 + driver</div>
    </div>
    <div class="item">
      <div class="tile">
        <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 23h26M5 23V10a1 1 0 011-1h22a1 1 0 011 1v13M9 23v3a1 1 0 001 1h2a1 1 0 001-1v-3M22 23v3a1 1 0 001 1h2a1 1 0 001-1v-3M8 13h7M17 13h7M8 16h7M17 16h7"/></svg>
      </div>
      <div class="name">Mini Bus</div>
      <div class="seats">32 + driver</div>
    </div>
    <div class="item">
      <div class="tile">
        <svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 24h30M3 24V8a1 1 0 011-1h26a1 1 0 011 1v16M7 24v3a1 1 0 001 1h2a1 1 0 001-1v-3M23 24v3a1 1 0 001 1h2a1 1 0 001-1v-3M6 11h6M14 11h6M22 11h6M6 14h6M14 14h6M22 14h6M6 17h6M14 17h6M22 17h6"/></svg>
      </div>
      <div class="name">Volvo</div>
      <div class="seats">56 + driver</div>
    </div>
  </div>
</div>
</body></html>
