<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 0; }
  .saffron {
    background: var(--color-saffron);
    color: #fff;
    padding: 36px 28px;
    text-align: center;
  }
  .saffron .eyebrow {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
  }
  .saffron h2 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 14px 0 12px;
    color: #fff;
  }
  .saffron h2 .accent { color: rgba(255,255,255,0.78); }
  .saffron p {
    font-size: 0.95rem;
    line-height: 1.55;
    color: rgba(255,255,255,0.92);
    margin: 0 0 18px;
    max-width: 50ch;
    margin-inline: auto;
  }
  .row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 999px;
    border: 0;
    cursor: pointer;
    font-family: var(--font-sans);
  }
  .wa { background: var(--color-whatsapp); color: #fff; }
  .call { background: #fff; color: var(--color-saffron-deep); }
  .creds {
    margin-top: 14px;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
  }
</style></head>
<body>
<div class="saffron">
  <div class="eyebrow">Ready when you are</div>
  <h2>Ready to book? <span class="accent">Two ways</span> to start.</h2>
  <p>WhatsApp for an instant quote, call for complex itineraries. No advance to enquire — paperwork only after you've seen the GST-itemised number.</p>
